name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        haxe-version: [latest, 4.3.7]
      fail-fast: false
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: krdlab/setup-haxe@v2
      with:
        haxe-version: ${{ matrix.haxe-version }}
    - name: Print Haxe version
      run: |
        haxe --version
    - name: Setup haxelib
      run: |
        haxelib dev hlsteam .
    - name: Build example
      run: |
        cd example
        haxe gameserver.hxml
        haxe test.hxml
        cd ..
